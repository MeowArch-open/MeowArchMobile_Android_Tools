name: build

on:
  push:
    branches: [main]
    paths:
      - 'adbd-standalone/**'
      - 'adb-standalone/**'
      - 'better_fastboot/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'adbd-standalone/**'
      - 'adb-standalone/**'
      - 'better_fastboot/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    # Shakedown build: native x86_64 adbd inside an Arch container (the same
    # distro family as the target, so libc++/clang versions match what was
    # verified locally). Smoke-tests the binary against a system adb client.
    name: native x86_64 smoke
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            git clang compiler-rt libc++ libc++abi lld cmake ninja make \
            protobuf libcap brotli zstd lz4 gcc-libs curl android-tools

      - uses: actions/checkout@v4

      - name: Fetch AOSP sources (pinned)
        working-directory: adbd-standalone
        run: ./scripts/fetch-aosp.sh

      - name: Check every patch applies with exact context
        run: |
          # Guards against a class of failure that already bit this repo twice.
          # A hunk whose context only matches with fuzz (patch's default allows
          # 2 lines of drift) is re-applied at a shifted offset on every
          # re-configure, because -N cannot recognize it as already present --
          # daemon/main.cpp had accumulated 22 copies of one block. The other
          # direction is worse: a hunk whose line counts do not match its body
          # applies with fuzz in one place and silently never applies at all in
          # another, which is how the USB-FFS guard stayed in the tree.
          # Every build now runs patch --fuzz=0; this step proves that is safe
          # for all nine patches across the three projects before CI builds.
          python3 scripts/check-patches.py

      - name: Configure & build (native)
        working-directory: adbd-standalone
        run: |
          cmake -B build-native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native -j"$(nproc)"

      - name: Verify the patched-in behaviour is actually compiled in
        working-directory: adbd-standalone
        run: |
          set -x
          # Both daemon/main.cpp patches used to fail silently: 0002 duplicated
          # its block on every re-configure (22 copies once) and 0003 left the
          # #if defined(__ANDROID__) guard around usb_init() in place, so the
          # binary never listened on /dev/usb-ffs/adb/ep0. Assert both.
          N=$(grep -c 'getenv("ADBD_NO_AUTH")' ../aosp-adbd/packages/modules/adb/daemon/main.cpp)
          [ "$N" = "1" ] || { echo "ADBD_NO_AUTH block appears $N times, want 1"; exit 1; }
          # The guard is gone: usb_init() must be reachable from adbd_main.
          objdump -dC build-native/adbd | awk '/^[0-9a-f]+ <.*>:/{f=$2} /call.*usb_init/{print f}' | grep -q 'adbd_main'
          # And the tree carries no leftover patch artifacts. Capture first:
          # a `find | grep -q` pipeline under `sh -e` is fragile (grep exits at
          # the first match, find takes SIGPIPE) and would misreport either way.
          ARTIFACTS=$(find ../aosp-adbd/packages/modules/adb -name '*.rej' -o -name '*.orig' | head -1)
          [ -z "$ARTIFACTS" ] || { echo "patch left artifacts: $ARTIFACTS"; exit 1; }
          # 0005 batches a directory listing into one write. A silent no-op here
          # would cost ~6 ms per directory in every recursive pull, and the only
          # symptom is slowness, so assert the two writes are gone.
          W=$(grep -c 'out.append(reinterpret_cast<const char\*>(&msg)' \
                ../aosp-adbd/packages/modules/adb/daemon/file_sync_service.cpp)
          [ "$W" = "2" ] || { echo "do_list does not buffer its listing ($W appends, want 2)"; exit 1; }
          if grep -q 'WriteFdExactly(s, &msg, sizeof(msg))' \
               ../aosp-adbd/packages/modules/adb/daemon/file_sync_service.cpp; then
            echo "do_list still writes per-entry"; exit 1
          fi

      - name: Smoke test (TCP, shell + push/pull)
        working-directory: adbd-standalone
        run: |
          ADBD_NO_AUTH=1 ADBD_PORT=15555 ./build-native/adbd &
          sleep 2
          adb connect 127.0.0.1:15555
          sleep 1
          adb -s 127.0.0.1:15555 shell 'echo ok-from-adbd && uname -m'
          echo smoke-payload > /tmp/adbd-smoke.txt
          adb -s 127.0.0.1:15555 push /tmp/adbd-smoke.txt /tmp/
          adb -s 127.0.0.1:15555 pull /tmp/adbd-smoke.txt /tmp/pulled.txt
          grep -q smoke-payload /tmp/pulled.txt

      - name: Upload adbd binary
        uses: actions/upload-artifact@v4
        with:
          name: adbd-x86_64
          path: adbd-standalone/build-native/adbd
          if-no-files-found: error

  build-aarch64:
    # The real target: cross-compile to aarch64 glibc with the Arch cross
    # toolchain, assemble an Arch Linux ARM sysroot, package with makepkg,
    # then smoke-test the aarch64 binary under qemu-user.
    name: cross aarch64 (Arch Linux ARM)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            git clang compiler-rt libc++ libc++abi lld cmake ninja make \
            protobuf libcap brotli zstd lz4 gcc-libs curl \
            aarch64-linux-gnu-gcc aarch64-linux-gnu-binutils \
            qemu-user-static fakeroot sudo

      - uses: actions/checkout@v4

      - name: Fetch AOSP sources (pinned)
        working-directory: adbd-standalone
        run: ./scripts/fetch-aosp.sh

      - name: Build native protoc first
        working-directory: adbd-standalone
        run: |
          cmake -B build-native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native -j"$(nproc)" --target protoc

      - name: Assemble aarch64 sysroot
        working-directory: adbd-standalone
        run: |
          # make-sysroot.sh copies the cross-gcc sysroot and overlays Arch
          # Linux ARM aarch64 packages fetched from the TUNA mirror.
          ./scripts/make-sysroot.sh

      - name: Configure & build (cross aarch64)
        working-directory: adbd-standalone
        run: |
          cmake -B build-aarch64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64.cmake \
            -DHOST_PROTOC="$PWD/build-native/protobuf/protoc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-aarch64 -j"$(nproc)"

      - name: Verify binary
        run: |
          file adbd-standalone/build-aarch64/adbd | tee /dev/stderr | grep -q 'ARM aarch64'
          # dynamic deps: glibc + ALARM libs only. libgcc_s is expected
          # (libc++ exception unwinding; ALARM gcc-libs ships it and the
          # PKGBUILD depends on it). libstdc++ must NOT appear — that would
          # mean the libc++ requirement was silently dropped.
          aarch64-linux-gnu-readelf -d adbd-standalone/build-aarch64/adbd | \
            grep NEEDED | tee /tmp/needed.txt
          ! grep -q 'libstdc++' /tmp/needed.txt

      - name: Smoke test under qemu-user
        working-directory: adbd-standalone
        run: |
          # binfmt registration needs privileges; invoke qemu directly instead.
          qemu-aarch64-static -L sysroot-aarch64 ./build-aarch64/adbd --version

      - name: Package (makepkg, arch = aarch64)
        working-directory: adbd-standalone
        run: |
          # buildsrc noop: package() reads build-aarch64/adbd in place.
          # CARCH=aarch64 makes .PKGINFO carry the target arch so the device
          # installs it with a plain pacman -U.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder .
          sudo -u builder bash -c 'CARCH=aarch64 makepkg -f'
          tar --zstd -xOf adbd-meowarch-*.pkg.tar.zst .PKGINFO | grep '^arch = aarch64$'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: adbd-meowarch-aarch64-pkg
          path: adbd-standalone/adbd-meowarch-*.pkg.tar.zst
          if-no-files-found: error

  build-adb:
    # Standalone build of AOSP's host adb *client* (platform-tools' adb).
    # The end-to-end suite drives it against the adbd daemon built by the
    # native job — client and daemon come from the same AOSP snapshot, so this
    # exercises the real protocol rather than a mock.
    name: adb x86_64 (standalone)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build deps
        run: |
          # libc++/libc++abi are required, not optional: adb's types.h
          # static_asserts that Block is standard-layout and libstdc++'s
          # unique_ptr is not. Without them protobuf's own sources fail with
          # "'atomic' file not found" — a misleading error that cost a CI run.
          pacman -Syu --noconfirm --needed \
            git clang cmake ninja make pkgconf zlib gcc-libs libc++ libc++abi \
            fakeroot curl python lz4 zstd brotli libusb systemd-libs \
            zsh fish

      - uses: actions/checkout@v4

      - name: Fetch AOSP sources (pinned; shared with the other jobs' tree)
        working-directory: adb-standalone
        run: ./scripts/fetch-aosp.sh

      - name: Configure & build (native)
        working-directory: adb-standalone
        run: |
          cmake -B build-native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native -j"$(nproc)"

      - name: Verify binary
        working-directory: adb-standalone
        run: |
          set -x   # never fail silently
          ./build-native/adb version | tee /tmp/ver.txt
          grep -q 'Android Debug Bridge version' /tmp/ver.txt
          # The pipelined directory walk replaced a recursive one; both of the
          # old call sites must be gone and the new helpers present, or a patch
          # silently did not apply and "building file list..." costs one round
          # trip per directory again.
          SYNC=../aosp-adbd/packages/modules/adb/client/file_sync_client.cpp
          grep -q 'SendRequestBatch' "$SYNC"
          grep -q 'SendRecv2Batch' "$SYNC"
          grep -q 'remote_build_list(sc, file_list, current.rpath' "$SYNC" \
            && { echo "the recursive walk is still there"; exit 1; } || true
          # Nagle off on accepted sockets (adb_listeners.cpp): two call sites.
          N=$(grep -c 'disable_tcp_nagle(fd.get())' ../aosp-adbd/packages/modules/adb/adb_listeners.cpp)
          [ "$N" = "2" ] || { echo "Nagle still on for accepted sockets ($N, want 2)"; exit 1; }
          # mDNS is deliberately absent; it must say so rather than pretend.
          ./build-native/adb mdns check > /tmp/mdns.txt 2>&1
          grep -q 'unavailable' /tmp/mdns.txt
          # libusb is a system dependency, so it must be a NEEDED entry
          # (boringssl/protobuf, by contrast, are statically linked).
          ldd ./build-native/adb | tee /tmp/ldd.txt
          grep -q 'libusb-1.0' /tmp/ldd.txt
          grep -q 'libbrotli' /tmp/ldd.txt
          if grep -qE 'libssl|libcrypto\.so|libprotobuf\.so' /tmp/ldd.txt; then
            echo "expected boringssl/protobuf to be static"; exit 1
          fi

      - name: Build adbd (the suite's peer)
        working-directory: adbd-standalone
        run: |
          cmake -B build-native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native -j"$(nproc)"

      - name: End-to-end suite against adbd
        working-directory: adb-standalone
        run: bash scripts/test-adb.sh build-native/adb ../adbd-standalone/build-native/adbd

      # The bar's layout cannot be checked through a real transfer: over
      # loopback a push finishes before enough frames are emitted. This drives
      # adb_progress directly under a pty whose window size it sets itself
      # (`script`'s pty is 0x0, so the binary would fall back to 80 columns and
      # the assertions would measure nothing).
      - name: Progress bar layout suite
        working-directory: adb-standalone
        run: |
          cmake --build build-native --target test_progress_layout -j"$(nproc)"
          python3 scripts/test-progress-layout.py

      - name: Package (makepkg)
        working-directory: adb-standalone
        run: |
          # Every runtime dependency must resolve to a real package name.
          # "liblz4" is the pkg-config module, not the package (that is "lz4");
          # a mismatch here fails makepkg with "Could not resolve all
          # dependencies", which is exactly what one CI run hit.
          pacman -T glibc gcc-libs libc++ libc++abi zlib lz4 zstd brotli libusb systemd-libs
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder . ../aosp-adbd
          sudo -u builder bash -c 'makepkg -f'
          tar --zstd -xOf adb-meowarch-*.pkg.tar.zst .PKGINFO | grep '^arch = x86_64$'
          # The package name stays adb-meowarch (upgrades), but both command
          # names ship: madb is the short one, adb-meowarch the original.
          tar --zstd -xOf adb-meowarch-*.pkg.tar.zst .PKGINFO | grep -qx 'pkgname = adb-meowarch'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst | grep -qx 'usr/bin/adb-meowarch'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst | grep -qx 'usr/bin/madb'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst | grep -qx 'usr/lib/adb-meowarch/adb'
          # Both names must be completable in all three shells, since both are
          # real executables on PATH.
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/bash-completion/completions/madb'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/bash-completion/completions/adb-meowarch'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/zsh/site-functions/_madb'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/zsh/site-functions/_adb-meowarch'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/fish/vendor_completions.d/madb.fish'
          tar --zstd -tf adb-meowarch-*.pkg.tar.zst |
            grep -qx 'usr/share/fish/vendor_completions.d/adb-meowarch.fish'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: adb-meowarch-x86_64-pkg
          path: adb-standalone/adb-meowarch-*.pkg.tar.zst
          if-no-files-found: error

      # The Linux job builds protoc, which the win32 cross build needs (a cross
      # build cannot run a target-architecture protoc), so it is uploaded here
      # rather than rebuilt by the Windows job.
      - name: Upload host protoc for the win32 cross build
        uses: actions/upload-artifact@v4
        with:
          name: adb-host-protoc
          path: adb-standalone/build-native/protobuf/protoc
          if-no-files-found: error
          retention-days: 1

  build-adb-windows:
    # Windows adb.exe, built the way Google builds it: soong's Windows host
    # toolchain is mingw-w64 GCC i686 (cc/config/x86_windows_host.go sets
    # -DUSE_MINGW; development/host/windows pins AdbWinApi to compile_multilib
    # "32"), linked against Google's prebuilt AdbWinApi.dll with the genuine
    # client/usb_windows.cpp backend. MSVC is not an option — the upstream
    # sources are POSIX-flavored and Google compiles them with mingw.
    #
    # Unlike the Linux build this one uses libstdc++ (mingw ships no libc++)
    # and compiles zlib/lz4/zstd/brotli/libusb from AOSP's external/ instead of
    # pkg-config, because Arch has no mingw cross packages for any of them.
    # adb_defaults' UNICODE/_UNICODE are applied to adb's targets only:
    # libbase/file.cpp passes a narrow char* to GetModuleFileName.
    name: adb.exe win32 (mingw cross)
    needs: build-adb
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 90
    steps:
      - name: Install build deps
        run: |
          # libc++/libc++abi are for the HOST protoc this job downloads from
          # build-adb, not for anything it compiles: protoc is a Linux binary
          # built with -stdlib=libc++ and links libc++.so.1 dynamically. Without
          # them the codegen step dies with
          #   protoc: error while loading shared libraries: libc++.so.1
          # (exit 127) — which is what one run of this job hit.
          pacman -Syu --noconfirm --needed \
            git cmake ninja make pkgconf fakeroot curl python \
            libc++ libc++abi gcc-libs \
            mingw-w64-gcc mingw-w64-crt mingw-w64-headers mingw-w64-winpthreads

      - uses: actions/checkout@v4

      - name: Download host protoc
        uses: actions/download-artifact@v4
        with:
          name: adb-host-protoc
          path: host-tools

      - name: Fetch AOSP sources (pinned; adds brotli + sparse development)
        working-directory: adb-standalone
        run: ./scripts/fetch-aosp.sh

      - name: Configure & build (mingw-w64 i686 cross)
        working-directory: adb-standalone
        run: |
          set -x   # never fail silently: every check below prints its input
          chmod +x ../host-tools/protoc
          # Run it once now. If its shared libraries are missing the failure is
          # otherwise reported by ninja as a bare "exit 127" on a generated
          # source, three hundred compile lines away from the cause.
          ../host-tools/protoc --version
          cmake -B build-win32 -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake \
                -DHOST_PROTOC="$PWD/../host-tools/protoc"
          cmake --build build-win32 -j"$(nproc)"
          cmake --build build-win32 --target test_suggest -j"$(nproc)"
          # 32-bit PE. `file` spells the machine differently across versions
          # ("Intel i386" on Arch, "Intel 80386" elsewhere) — accept both.
          file build-win32/adb.exe | tee /tmp/f.txt
          grep -qiE 'PE32.*(i386|80386|x86)' /tmp/f.txt
          # Self-contained: static libstdc++/libgcc/winpthread. The only DLL
          # imports must be Windows system DLLs + Google's AdbWinApi.dll —
          # which also proves usb_windows.cpp is the backend that got linked.
          i686-w64-mingw32-objdump -p build-win32/adb.exe \
            | grep 'DLL Name' | tee /tmp/dlls.txt
          grep -q 'AdbWinApi.dll' /tmp/dlls.txt
          if grep -qiE 'libstdc|libgcc|libwinpthread' /tmp/dlls.txt; then
            echo "static runtimes leaked into imports"; exit 1
          fi
          # The Windows entry point is sysdeps_win32.cpp's wmain(), selected by
          # -municode. Without it the CRT would look for main(int, char**) and
          # the link would have failed; assert the symbol is really there.
          i686-w64-mingw32-nm build-win32/adb.exe | grep -q 'wmain'

      - name: Stage dist (exe + Google's DLLs, platform-tools layout)
        working-directory: adb-standalone
        run: |
          mkdir -p dist-win32
          cp build-win32/adb.exe build-win32/test_suggest.exe \
             build-win32/AdbWinApi.dll build-win32/AdbWinUsbApi.dll dist-win32/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adb-meowarch-win32
          path: adb-standalone/dist-win32/*
          if-no-files-found: error

  test-adb-windows:
    # Runs the cross-compiled adb.exe NATIVELY (no wine) on a windows-latest
    # runner: a real Windows host runs the PE directly, so this exercises the
    # genuine console/UTF-16 argv path rather than an emulation of it.
    name: adb.exe smoke (windows native)
    needs: build-adb-windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adb-meowarch-win32
          path: dist

      # adbd is a Linux ELF, so it cannot run on this runner: what this job
      # proves is everything ABOVE the socket layer (entry point, UTF-16 argv,
      # console detection, i18n, help, suggestions, completion generation).
      # The device-level path — a real sync push/pull round trip through ws2_32,
      # sysdeps_win32's FD indirection and adb_writev over WSABUF — is covered
      # by scripts/test-adb-wine.sh, which drives adb.exe under wine against the
      # native Linux adbd.
      - name: Smoke test
        shell: bash
        working-directory: dist
        run: |
          # NOTE: never pipe a producer straight into `grep -q` here. Under
          # `-o pipefail` (Git-bash's default on this runner) grep exits at the
          # first match, the writer takes EPIPE, and the *pipeline* fails — the
          # step then dies with no output at all. Capture to a file first.
          set -euo pipefail
          set -x   # name the failing check in the log
          strip_cr() { tr -d '\r'; }

          ./adb.exe version > version.txt 2>&1
          strip_cr < version.txt | grep -q 'Android Debug Bridge version'
          strip_cr < version.txt | grep -q 'meowarch-adb'
          # GetExecutablePath on Windows goes through libbase's utf8.cpp +
          # GetModuleFileName, which is exactly why base_static is compiled
          # WITHOUT UNICODE. If this line disappears, that scoping broke.
          strip_cr < version.txt | grep -q 'Installed as'

          # help: every documented command still listed, sections addressable.
          ./adb.exe --lang=en help > help.txt 2>&1
          for c in devices connect push pull install shell reboot sideload \
                   bugreport keygen wait-for mdns; do
            strip_cr < help.txt | grep -qE "(^| )$c([ \\[]|$)"
          done
          ./adb.exe help --list-sections > sections.txt 2>&1
          strip_cr < sections.txt | grep -q 'networking'
          strip_cr < sections.txt | grep -q 'meowarch'

          # Did-you-want, in English and localized (these exit 1 by design).
          ./adb.exe --lang=en sheel > sheel.txt 2>&1 || true
          strip_cr < sheel.txt | grep -q "Did you want 'shell'?"
          # the help pointer must drop the .exe suffix
          strip_cr < sheel.txt | grep -q "Run 'adb help' for usage"
          ./adb.exe --lang=en --one-devic > opt.txt 2>&1 || true
          strip_cr < opt.txt | grep -q "Did you want '--one-device'?"
          # a foreign word gets NO hint (a wrong guess trains the user to
          # ignore the line): exactly one line, upstream's error.
          ./adb.exe --lang=en xyzzy > xyzzy.txt 2>&1 || true
          test "$(strip_cr < xyzzy.txt | grep -c '')" -eq 1
          ./adb.exe --lang=zh_CN sheel > sheel_zh.txt 2>&1 || true
          strip_cr < sheel_zh.txt | grep -q '您是否想输入'
          ./adb.exe --lang=ja --list-langs > langs.txt 2>&1
          strip_cr < langs.txt | grep -q '日本語'

          # our five flags survive argv compaction on Windows too
          ./adb.exe --list-langs version > /dev/null
          ./adb.exe --no-color version > /dev/null
          ./adb.exe --no-progress version > /dev/null

          # the suggestion scorer, as a native PE
          ./test_suggest.exe > suggest.txt 2>&1
          strip_cr < suggest.txt | grep -q '0 failed'

          # completion generation works on Windows (same generator)
          ./adb.exe --shell-completion=bash > comp.bash 2>/dev/null
          ./adb.exe --shell-completion=zsh > comp.zsh 2>/dev/null
          ./adb.exe --shell-completion=fish > comp.fish 2>/dev/null
          strip_cr < comp.bash | grep -q 'complete -F _madb madb adb-meowarch'
          strip_cr < comp.zsh | grep -q '#compdef madb adb-meowarch'
          strip_cr < comp.fish | grep -q 'complete -c madb'
          # both fish bugs must stay fixed in the generated script: the list
          # index guard, and the empty-transport guard.
          strip_cr < comp.fish | grep -q 'test (count $cmd) -gt $i'
          strip_cr < comp.fish | grep -q 'count $__madb_target'
          ./adb.exe --shell-completion=csh > /dev/null 2>&1 && exit 1 || true

          # mDNS is deliberately not built in on any platform
          ./adb.exe mdns check > mdns.txt 2>&1 || true
          strip_cr < mdns.txt | grep -qi 'unavailable'

  test-adb-windows-wine:
    # The device-level Windows path, which a windows-latest runner cannot cover:
    # adbd is a Linux ELF, so it cannot run there. This job drives the
    # cross-compiled adb.exe under wine against the NATIVE adbd that build-native
    # produces, on Linux, over TCP. That is the only way to prove a real sync
    # push/pull round trip comes back byte-identical through ws2_32,
    # sysdeps_win32's FD indirection and adb_writev over WSABUF, and that all
    # four compression codecs survive the cross build.
    #
    # better_fastboot has no equivalent job because it needs no Linux-side peer;
    # adb does, and its wine suite is the e2e half of the Windows story.
    name: adb.exe e2e (wine vs native adbd)
    needs: [build-adb-windows, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download adb.exe + test binaries
        uses: actions/download-artifact@v4
        with:
          name: adb-meowarch-win32
          path: adb-standalone/build-win32

      - name: Download native adbd
        uses: actions/download-artifact@v4
        with:
          name: adbd-x86_64
          path: adbd-bin

      - name: Ensure wine (with 32-bit support) is available
        run: |
          # adb.exe is a PE32 i386 binary, so wine32 is required — wine64 alone
          # reports "cannot run 32-bit applications". Probe first: the runner
          # image usually already has wine, and `apt-get update` after
          # --add-architecture can fail on a missing i386 mirror.
          if ! dpkg --print-foreign-architectures | grep -qx i386; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
          fi
          # --no-install-recommends: wine otherwise drags in a desktop stack the
          # headless runner has no display server for.
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 ||
            sudo apt-get install -y --no-install-recommends wine
          wine --version
          # One real invocation before the suite runs: the first wine start
          # builds its prefix, which takes far longer than any single check and
          # would otherwise land inside the suite's own timeouts.
          chmod +x adb-standalone/build-win32/adb.exe
          WINEDEBUG=-all wine adb-standalone/build-win32/adb.exe version | head -2

      - name: Run the wine suite
        working-directory: adb-standalone
        run: |
          chmod +x build-win32/test_suggest.exe ../adbd-bin/adbd
          # The suite takes adbd as its second argument and defaults to
          # ../adbd-standalone/build-native/adbd, which does not exist in CI.
          bash scripts/test-adb-wine.sh "$PWD/build-win32" "$PWD/../adbd-bin/adbd" 2>&1 \
            | tee wine.txt
          grep -qE '^== summary: [0-9]+ passed, 0 failed' wine.txt

  build-fastboot:
    # Standalone build of AOSP's official host fastboot tool (the real
    # usb_linux backend + Android-forked mke2fs/make_f2fs), native x86_64.
    # Smoke-tests binary version, command parity, and the sparse-image
    # generators that `fastboot -w` shells out to.
    name: fastboot x86_64 (standalone)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            git clang cmake ninja make pkgconf zlib openssl gcc-libs \
            fakeroot curl python android-tools zsh fish

      - uses: actions/checkout@v4

      - name: Fetch AOSP sources (pinned)
        working-directory: better_fastboot
        run: ./scripts/fetch-aosp.sh

      - name: Configure & build (native)
        working-directory: better_fastboot
        run: |
          cmake -B build-native -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native -j"$(nproc)"

      - name: Smoke test
        working-directory: better_fastboot
        run: |
          set -e
          ./build-native/fastboot --version | tee /tmp/v.txt | grep -q 'fastboot version'
          # official usb_linux backend links neither libusb nor libstdc++-only
          # surprises; it must talk to /dev/bus/usb via usbdevicefs ioctls.
          ldd ./build-native/fastboot | tee /tmp/ldd.txt
          ! grep -q libusb /tmp/ldd.txt
          # command parity against the distro's platform-tools fastboot
          diff <(./build-native/fastboot --help 2>&1 | grep -oE '^[a-z][a-zA-Z-]+' | sort -u) \
               <(fastboot --help 2>&1 | grep -oE '^[a-z][a-zA-Z-]+' | sort -u)
          # mke2fs -E android_sparse (the Android e2fsprogs fork) emits a
          # sparse ext4 image, as `fastboot -w` needs.
          FB="$PWD/build-native"
          AOSP="$PWD/../aosp-adbd"
          cd /tmp
          MKE2FS_CONFIG="$AOSP/system/extras/ext4_utils/mke2fs.conf" \
            "$FB/mke2fs" -t ext4 -b 4096 \
            -E android_sparse -O uninit_bg ud.img 512 >/dev/null 2>&1
          python3 -c "import struct;m,=struct.unpack('<I',open('/tmp/ud.img','rb').read(4));assert m==0xed26ff3a,'not sparse'"
          # make_f2fs -S (the Android f2fs fork) emits a sparse f2fs image.
          "$FB/make_f2fs" -S 209715200 -g android f2.img >/dev/null 2>&1
          python3 -c "import struct;m,=struct.unpack('<I',open('/tmp/f2.img','rb').read(4));assert m==0xed26ff3a,'not sparse'"

      - name: UX self-test (color / progress / i18n / Did-you-want)
        working-directory: better_fastboot
        run: |
          # unit-level checks (no device): suggestion ranking, i18n table
          # integrity incl. format-specifier parity across languages, help-row
          # well-formedness.
          ./build-native/fastboot_selftest
          # ASAN build: catches varargs/format UB in the glue that the plain
          # build may not crash on (a %s-without-arg in the progress Draw()
          # shipped once as a layout-dependent SIGSEGV).
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j"$(nproc)"
          # end-to-end: byte-parity of piped English output, Did-you-want on
          # `flass`, NO_COLOR/NO_PROGRESS opt-outs, a live progress bar +
          # speed readout, and the ASAN boot regression against a mock TCP
          # fastboot device (pty capture).
          bash scripts/test-ux.sh

      - name: Package (makepkg)
        working-directory: better_fastboot
        run: |
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder . ../aosp-adbd
          sudo -u builder bash -c 'makepkg -f'
          tar --zstd -xOf fastboot-meowarch-*.pkg.tar.zst .PKGINFO | grep '^arch = x86_64$'
          # both command names must be present in the package
          tar --zstd -tf fastboot-meowarch-*.pkg.tar.zst | grep -qx 'usr/bin/mfastboot'
          tar --zstd -tf fastboot-meowarch-*.pkg.tar.zst | grep -qx 'usr/bin/fastboot-meowarch'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-meowarch-x86_64-pkg
          path: better_fastboot/fastboot-meowarch-*.pkg.tar.zst
          if-no-files-found: error

  build-fastboot-windows:
    # Windows fastboot.exe, built exactly the way Google builds it: soong's
    # Windows host toolchain is mingw-w64 GCC i686 (cc/config/x86_windows_host.go
    # sets -DUSE_MINGW; development/host/windows pins AdbWinApi to
    # compile_multilib "32"), linked against Google's prebuilt AdbWinApi.dll
    # with the genuine usb_windows.cpp backend. MSVC is not an option — the
    # upstream sources are POSIX-flavored (getopt_long, flock, unistd.h) and
    # Google compiles them with mingw, not cl.exe.
    #
    # Compilation is cross-done from Linux in CI (never on the dev machine);
    # the .exe is then smoke-tested NATIVELY on a windows-latest runner (no
    # wine — a real Windows host runs the PE directly).
    name: fastboot.exe win32 (mingw cross)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja make pkgconf fakeroot curl python \
            mingw-w64-gcc mingw-w64-crt mingw-w64-headers mingw-w64-winpthreads

      - uses: actions/checkout@v4

      - name: Fetch AOSP sources (pinned; adds sparse development checkout)
        working-directory: better_fastboot
        run: ./scripts/fetch-aosp.sh

      - name: Configure & build (mingw-w64 i686 cross)
        working-directory: better_fastboot
        run: |
          set -x   # never fail silently: every check below prints its input
          cmake -B build-win32 -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake
          cmake --build build-win32 -j"$(nproc)"
          # 32-bit PE. `file` spells the machine differently across versions
          # ("Intel i386" on Arch, "Intel 80386" elsewhere) — accept both.
          file build-win32/fastboot.exe | tee /tmp/f.txt
          grep -qiE 'PE32.*(i386|80386|x86)' /tmp/f.txt
          # self-contained: static libstdc++/libgcc/winpthread; the only DLL
          # imports are Windows system DLLs + Google's AdbWinApi.dll.
          i686-w64-mingw32-objdump -p build-win32/fastboot.exe \
            | grep 'DLL Name' | tee /tmp/dlls.txt
          grep -q 'AdbWinApi.dll' /tmp/dlls.txt
          if grep -qiE 'libstdc|libgcc|libwinpthread' /tmp/dlls.txt; then
            echo "static runtimes leaked into imports"; exit 1
          fi

      - name: Stage dist (exe + Google's DLLs, platform-tools layout)
        working-directory: better_fastboot
        run: |
          mkdir -p dist-win32
          cp build-win32/fastboot.exe build-win32/fastboot_selftest.exe \
             build-win32/AdbWinApi.dll build-win32/AdbWinUsbApi.dll dist-win32/
          cp tests/mock_device.py tests/help-baseline-en.txt \
             tests/make_payload.py tests/test_flash_x.py dist-win32/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-meowarch-win32
          path: better_fastboot/dist-win32/*
          if-no-files-found: error

  test-fastboot-windows:
    # Runs the cross-compiled fastboot.exe NATIVELY (no wine) and replays the
    # platform-independent UX suite: selftest, --version, help byte-parity vs
    # the committed upstream baseline, Did-you-want in en/zh_CN/ja, and a live
    # flash through the mock TCP device (exercises the ws2_32 socket path).
    name: fastboot.exe smoke (windows native)
    needs: build-fastboot-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fastboot-meowarch-win32
          path: dist

      - name: Smoke test
        shell: bash
        working-directory: dist
        run: |
          # NOTE: never pipe a producer straight into `grep -q` here. Under
          # `-o pipefail` (Git-bash's default on this runner) grep exits at the
          # first match, the writer takes EPIPE, and the *pipeline* fails — the
          # step then dies with no output at all, which is how this job failed
          # twice. Every check below captures output to a file first.
          set -euo pipefail
          set -x   # name the failing check in the log
          strip_cr() { tr -d '\r'; }

          # unit checks (suggestion ranking, i18n format-specifier parity,
          # help-row integrity) run natively on Windows.
          ./fastboot_selftest.exe > selftest.txt 2>&1
          strip_cr < selftest.txt | grep -q 'all checks passed'

          ./fastboot.exe --version > version.txt 2>&1
          strip_cr < version.txt | grep -q 'fastboot version'

          # help: upstream's 100 lines byte-identical (CRLF-normalized). Our
          # flash-x command renders inside upstream's "flashing:" section, so it
          # is filtered out first — only that entry (its line plus the 28-space
          # continuation lines under it), never an upstream line. Same filter as
          # scripts/test-ux.sh; keep the two in step.
          ./fastboot.exe --help > help.txt 2>/dev/null
          strip_flashx() {
            awk 'skip && /^ {28}/ { next } { skip = 0 }
                 /^ flash-x[ ]/ { skip = 1; next }
                 { print }'
          }
          strip_cr < help.txt | strip_flashx | sed -n '1,100p' > help100.txt
          diff help100.txt help-baseline-en.txt
          # ...and it must actually be in the flashing section, which the diff
          # above deliberately does not check.
          strip_cr < help.txt | grep -n '^ flash-x' | cut -d: -f1 > fx.line
          strip_cr < help.txt | grep -n '^basics:' | cut -d: -f1 > basics.line
          test "$(cat fx.line)" -lt "$(cat basics.line)"

          # Did-you-want across languages (these exit 1 by design).
          ./fastboot.exe flass > flass.txt 2>&1 || true
          strip_cr < flass.txt | grep -q "Did you want 'flash'"
          LANG=zh_CN.UTF-8 ./fastboot.exe flass > flass_zh.txt 2>&1 || true
          strip_cr < flass_zh.txt | grep -q '您是否想输入'
          LANG=ja_JP.UTF-8 ./fastboot.exe --list-langs > langs.txt 2>&1
          strip_cr < langs.txt | grep -q '日本語'

          # completion-script generation works on Windows too (same generator)
          ./fastboot.exe --shell-completion=bash > comp.bash 2>/dev/null
          ./fastboot.exe --shell-completion=zsh > comp.zsh 2>/dev/null
          ./fastboot.exe --shell-completion=fish > comp.fish 2>/dev/null
          grep -q 'complete -F _mfastboot mfastboot fastboot-meowarch' comp.bash
          grep -q '#compdef mfastboot fastboot-meowarch' comp.zsh
          grep -q "complete -c mfastboot" comp.fish
          # flash's second argument must complete files, not partitions
          grep -q '__fbma_arg_from 1 flash flash:raw' comp.fish
          grep -q 'zh_TW' comp.fish
          ./fastboot.exe --shell-completion=csh > /dev/null 2>&1 && exit 1 || true

          # live flash over TCP against the mock device (ws2_32 path).
          python mock_device.py 5601 > mock.log 2>&1 & MPID=$!
          sleep 2
          python -c "import os;open('boot.img','wb').write(os.urandom(8000000))"
          ./fastboot.exe -s tcp:127.0.0.1:5601 flash boot boot.img > flash.txt 2>&1
          kill $MPID 2>/dev/null || true
          strip_cr < flash.txt
          strip_cr < flash.txt | grep -q 'OKAY'
          strip_cr < flash.txt | grep -q 'Finished'

          # flash-x natively on Windows: builds real payload.bin files
          # (xz/bzip2/raw ops, delta ops, corrupt blobs) and compares what the
          # exe transmitted with what went in. This is the check that the
          # statically compiled libxz/libbz2 and the Windows temp-file path
          # actually work — libbase's TemporaryFile uses _wmktemp_s there, and
          # extraction must leave no file behind.
          python test_flash_x.py ./fastboot.exe > flashx.txt 2>&1
          strip_cr < flashx.txt
          strip_cr < flashx.txt | tail -1 | grep -q '0 failed'
